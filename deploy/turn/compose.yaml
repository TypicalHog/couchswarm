services:
  turn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    restart: unless-stopped
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${COUCHSWARM_TURN_SECRET:?Set the TURN secret}"
      - "--realm=${TURN_REALM:?Set the relay hostname}"
      - "--listening-ip=${TURN_PUBLIC_IP:?Set the server public IPv4}"
      - "--relay-ip=${TURN_PUBLIC_IP:?Set the server public IPv4}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49359"
      - "--no-tls"
      - "--no-tcp-relay"
      - "--no-multicast-peers"
      - "--user-quota=12"
      - "--total-quota=128"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=224.0.0.0-255.255.255.255"
      - "--denied-peer-ip=::1"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
