services:
  turn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${COUCHSWARM_TURN_SECRET:?Set the TURN secret}"
      - "--realm=${TURN_REALM:?Set the relay hostname}"
      - "--listening-ip=${TURN_PUBLIC_IP:?Set the server public IPv4}"
      - "--relay-ip=${TURN_PUBLIC_IP:?Set the server public IPv4}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49359"
      - "--no-tls"
      - "--no-tcp-relay"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--no-software-attribute"
      - "--no-stun-backward-compatibility"
      - "--response-origin-only-with-rfc5780"
      - "--no-rfc5780"
      - "--user-quota=48"
      - "--total-quota=128"
      - "--max-bps=3000000"
      - "--bps-capacity=50000000"
      # A viewer connection the helper drops leaves its allocation behind: its ICE stack sends no
      # zero-lifetime refresh, so the slot is only freed when the lifetime coturn granted runs out.
      - "--max-allocate-lifetime=300"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=224.0.0.0-255.255.255.255"
      - "--denied-peer-ip=192.0.0.0-192.0.0.255"
      - "--denied-peer-ip=192.88.99.0-192.88.99.255"
      - "--denied-peer-ip=198.18.0.0-198.19.255.255"
      # Cloud platform service on a public-looking address (Azure DNS, DHCP and wire server)
      - "--denied-peer-ip=168.63.129.16"
      - "--denied-peer-ip=::1"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
