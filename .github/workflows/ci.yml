name: checks
# A push to a branch with an open pull request would otherwise run everything here twice.
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  checks:
    runs-on: ubuntu-latest
    # package.json promises Node 22.13+ and 24, and the helper is packaged on 24, so both of those run here.
    strategy: { matrix: { node: ['22.13.0', '24'] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      # ip-set's preinstall fetches only-allow from the registry outside the lockfile's integrity hashes, so this
      # job installs no dependency code at all; node-datachannel's prebuilt binding is the one the suites need back.
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-datachannel
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:offline
      # A throwaway file database: the build migrates whatever TURSO_DATABASE_URL points at, and a
      # future repo secret must never let a pull request migrate the production one.
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: '1', TURSO_DATABASE_URL: 'file:.ci/rooms.db' }
      - run: |
          npx next start --port 3001 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/ && break; sleep 1; done
          npm run test:rooms
          npm run test:remote
        env: { TURSO_DATABASE_URL: 'file:.ci/rooms.db' }
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The launcher is only ever compiled while packaging on Windows, so a C# 6 idiom the inbox compiler
      # rejects reaches the owner's build machine as a surprise. Compile it here with the same csc.exe.
      - shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /out:"$env:RUNNER_TEMP\launcher.exe" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll helper\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  relay:
    runs-on: ubuntu-latest
    # Nothing else here ever starts the relay, so a flag in compose.yaml that the pinned coturn does not know - it
    # stops turnserver before it listens - reached operators once. Start that image from that file, on loopback with
    # a throwaway secret, and check the STUN answer it gives against what the file asks for.
    env: { COUCHSWARM_TURN_SECRET: ci-only-secret, TURN_REALM: relay.ci.invalid, TURN_PUBLIC_IP: 127.0.0.1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/turn/compose.yaml up -d
      - run: node scripts/stun-probe.mjs 127.0.0.1 3478
      - if: always()
        run: docker compose -f deploy/turn/compose.yaml logs --no-color
